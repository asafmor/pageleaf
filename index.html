<script>
'use strict';
const $ = id => document.getElementById(id);
const escapeHTML = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slugify = text => text.normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu,'').trim().replace(/[\s_]+/g,'-') || 'untitled';
function uniqueSlug(text, used){const base=slugify(text);let id=base,n=2;while(used.has(id))id=base+'-'+n++;used.add(id);return id;}
function plainText(token){return (token.children||[]).map(t=>t.type==='image'?t.content:t.type==='softbreak'||t.type==='hardbreak'?' ':t.content||'').join('')||token.content||'Untitled';}
function readMarkdown(){return $('markdown-source').textContent.replace(/&lt;\/script/gi,'<'+'/script');}
class DocumentParser {
 constructor(md){this.md=md;}
 parse(source){
  const env={},tokens=this.md.parse(source,env),doc={title:'Untitled document',sections:[],pages:[],anchors:new Map(),env};
  const sectionSlugs=new Set(),headingSlugs=new Set();let section=null,page=null,titleFound=false;
  const addSection=title=>{section={title,slug:uniqueSlug(title,sectionSlugs),pages:[],used:new Set()};doc.sections.push(section);page=null;return section;};
  const addPage=(title,kind='page')=>{if(!section)addSection('Document');page={title,slug:uniqueSlug(title,section.used),kind,tokens:[],toc:[],section};page.route='#/'+section.slug+'/'+page.slug;section.pages.push(page);doc.pages.push(page);return page;};
  const ensurePage=()=>page||addPage('Overview','overview');
  for(let i=0;i<tokens.length;i++){
   const t=tokens[i];
   if(t.type==='heading_open'){
    const level=Number(t.tag.slice(1)),title=plainText(tokens[i+1]),id=uniqueSlug(title,headingSlugs);t.attrSet('id','heading-'+id);
    if(t.level===0&&level===1&&!titleFound){doc.title=title;titleFound=true;doc.titleAnchor=id;i+=2;continue;}
    if(t.level===0&&level===2){addSection(title);section.anchor=id;i+=2;continue;}
    if(t.level===0&&level===3){addPage(title);doc.anchors.set(id,{page});i+=2;continue;}
    ensurePage();doc.anchors.set(id,{page,id});if(level>=4)page.toc.push({title,id,level});
   }
   ensurePage().tokens.push(t);
  }
  for(const s of doc.sections){if(!s.pages.length){section=s;addPage(s.title,'overview');}if(s.anchor)doc.anchors.set(s.anchor,{page:s.pages[0]});}
  if(!doc.pages.length){addSection('Document');addPage(doc.title,'overview');}
  // Reconstruct source order after filling empty sections.
  doc.pages=doc.sections.flatMap(s=>s.pages);if(doc.titleAnchor)doc.anchors.set(doc.titleAnchor,{page:doc.pages[0]});
  for(const p of doc.pages){
   if(p.toc.length)continue;
   for(let i=0;i<p.tokens.length;i++){
    const token=p.tokens[i],inline=p.tokens[i+1];
    if(token.type!=='paragraph_open'||token.level!==0||inline?.type!=='inline')continue;
    const children=inline.children||[],start=children.findIndex(t=>t.type!=='text'||t.content.trim());
    if(start<0||children[start].type!=='strong_open')continue;
    const end=children.findIndex((t,j)=>j>start&&t.type==='strong_close');
    if(end<0)continue;
    const label=children.slice(start+1,end).map(t=>t.content||'').join('').trim();
    const remainder=children.slice(end+1).map(t=>t.content||'').join('').trim();
    if(!label||label.length>100||(remainder&&!/[:：]$/.test(label)))continue;
    const title=label.replace(/[:：.]$/,'');
    const id=uniqueSlug(title,headingSlugs);token.attrSet('id','heading-'+id);
    p.toc.push({title,id,level:4});doc.anchors.set(id,{page:p,id});
   }
  }
  return doc;
 }
}
class MarkdownRenderer {
 constructor(md,model){this.md=md;this.model=model;const original=md.renderer.rules.link_open||((ts,i,o,e,r)=>r.renderToken(ts,i,o));md.renderer.rules.link_open=(ts,i,o,e,r)=>{const t=ts[i],href=t.attrGet('href');if(href?.startsWith('#')&&!href.startsWith('#/')){let key;try{key=decodeURIComponent(href.slice(1));}catch{key=href.slice(1);}const target=model.anchors.get(key);if(target)t.attrSet('href',target.page.route+(target.id?'/'+target.id:''));}t.attrSet('target','_blank');t.attrSet('rel','noopener noreferrer');return original(ts,i,o,e,r);};}
 render(page){return this.md.renderer.render(page.tokens,this.md.options,this.model.env);}
}
// Extension point: add future transformations here. Navigation and TOC are core UI.
const contentEnhancements=[];
function enhanceContent(article){for(const enhance of contentEnhancements)enhance(article);}
class HashRouter {
 constructor(model,onRoute){this.model=model;this.onRoute=onRoute;this.positions=new Map();this.current=null;this.lastPages=new Map();}
 start(){if('scrollRestoration'in history)history.scrollRestoration='manual';window.addEventListener('hashchange',()=>this.resolve());this.resolve(true);}
 resolve(initial=false){
  if(location.hash==='#content'){$('content').focus();return;}
  if(this.current)this.positions.set(this.current,window.scrollY);
  let parts;try{parts=decodeURIComponent(location.hash).replace(/^#\//,'').split('/');}catch{parts=[];}
  let section=this.model.sections.find(s=>s.slug===parts[0]),page=section?.pages.find(p=>p.slug===parts[1]),anchor=parts.slice(2).join('/');
  if(!page){let alias;try{alias=this.model.anchors.get(decodeURIComponent(location.hash.slice(1)));}catch{}page=alias?.page||section?.pages[0]||this.model.pages[0];anchor=alias?.id||'';history.replaceState(null,'',page.route+(anchor?'/'+anchor:''));}
  if(anchor&&!page.tokens.some(t=>t.attrGet('id')==='heading-'+anchor)){anchor='';history.replaceState(null,'',page.route);}
  this.current=location.hash;this.lastPages.set(page.section.slug,page);this.onRoute(page,anchor,initial);const route=this.current;
  requestAnimationFrame(()=>{if(this.current!==route)return;if(anchor)document.getElementById('heading-'+anchor)?.scrollIntoView();else window.scrollTo(0,this.positions.get(route)||0);});
 }
}
class DocumentViewer {
 constructor(model,renderer){this.model=model;this.renderer=renderer;this.router=new HashRouter(model,(...args)=>this.render(...args));this.observer=null;}
 link(page,label,current){return `<a href="${page.route}"${page===current?' aria-current="page"':''}>${escapeHTML(label)}</a>`;}
 start(){
  $('document-title').textContent=this.model.title;if('ResizeObserver'in window)new ResizeObserver(entries=>document.documentElement.style.setProperty('--header',entries[0].target.offsetHeight+'px')).observe(document.querySelector('.header'));$('status').hidden=true;$('layout').hidden=false;
  $('menu').onclick=()=>$('drawer').showModal();$('close-menu').onclick=()=>$('drawer').close();$('drawer').addEventListener('click',e=>{if(e.target===$('drawer')){const r=$('drawer').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('drawer').close();}if(e.target.closest('a'))$('drawer').close();});
  window.addEventListener('beforeprint',()=>{$('print-content').innerHTML=`<h1>${escapeHTML(this.model.title)}</h1>`+this.model.sections.map(s=>`<section><h2>${escapeHTML(s.title)}</h2>${s.pages.map(p=>`<article><h3>${escapeHTML(p.title)}</h3>${this.renderer.render(p)}</article>`).join('')}</section>`).join('');});window.addEventListener('afterprint',()=>{$('print-content').replaceChildren();});this.router.start();
 }
 render(page,anchor,initial){
  const s=page.section;document.title=page.title+' · '+this.model.title+' | Pageleaf';
  $('primary').innerHTML=this.model.sections.map(section=>`<a href="${(this.router.lastPages.get(section.slug)||section.pages[0]).route}"${section===s?' aria-current="true"':''}>${escapeHTML(section.title)}</a>`).join('');
  $('secondary').innerHTML=s.pages.map(p=>this.link(p,p.title,page)).join('');
  $('mobile-nav').innerHTML=this.model.sections.map(section=>`<h3>${escapeHTML(section.title)}</h3>${section.pages.map(p=>this.link(p,p.title,page)).join('')}`).join('');
  $('page-title').textContent=page.title;
  $('article').innerHTML=this.renderer.render(page);enhanceContent($('article'));
  const toc=page.toc.map(h=>`<a href="${page.route}/${h.id}" data-level="${h.level}">${escapeHTML(h.title)}</a>`).join('')||`<a href="${page.route}">${escapeHTML(page.title)}</a>`;$('toc').querySelector('nav').innerHTML=toc;$('mobile-toc').querySelector('nav').innerHTML=toc;$('toc').style.visibility=toc?'visible':'hidden';$('mobile-toc').hidden=!toc;$('mobile-toc').style.display=toc?'':'none';
  const index=this.model.pages.indexOf(page);$('pager').innerHTML=[index>0?`<a href="${this.model.pages[index-1].route}"><small>← Previous</small>${escapeHTML(this.model.pages[index-1].title)}</a>`:'',index<this.model.pages.length-1?`<a href="${this.model.pages[index+1].route}"><small>Next →</small>${escapeHTML(this.model.pages[index+1].title)}</a>`:''].join('');
  this.observer?.disconnect();if('IntersectionObserver'in window){this.observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting);if(visible.length)this.markHeading(visible[0].target.id.slice(8));},{rootMargin:'-140px 0px -55% 0px'});page.toc.forEach(h=>this.observer.observe(document.getElementById('heading-'+h.id)));}this.markHeading(anchor||page.toc[0]?.id);
  if(!initial)$('content').focus({preventScroll:true});
 }
 markHeading(id){document.querySelectorAll('.toc a,.mobile-toc a').forEach(a=>{if(a.hash.endsWith('/'+id))a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});}
}
try{const theme=localStorage.getItem('pageleaf-theme');if(['paper','midnight'].includes(theme))document.documentElement.dataset.theme=theme;}catch{}
$('theme').value=document.documentElement.dataset.theme;$('theme').onchange=e=>{document.documentElement.dataset.theme=e.target.value;try{localStorage.setItem('pageleaf-theme',e.target.value);}catch{}};
if(!window.markdownit){$('status').textContent='The Markdown library could not load. Connect to the internet and reload this file to try again.';}else{try{const md=window.markdownit({html:false,linkify:true,typographer:true});const model=new DocumentParser(md).parse(readMarkdown());new DocumentViewer(model,new MarkdownRenderer(md,model)).start();}catch(error){$('status').hidden=false;$('status').textContent='This document could not be opened: '+error.message;console.error(error);}}
